<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bodyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#581c87" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="60%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Aura / Shadow Backing -->
  <circle cx="100" cy="100" r="90" fill="url(#bodyGlow)" />

  <!-- Cloak / Armor Body -->
  <g filter="url(#shadow)">
    <!-- Shoulders & Cloak -->
    <path d="M 40 160 Q 100 130 160 160 L 150 190 Q 100 170 50 190 Z" fill="#1e1b4b" stroke="#4338ca" stroke-width="2"/>
    <path d="M 50 130 Q 100 110 150 130 L 160 160 Q 100 140 40 160 Z" fill="#312e81" stroke="#6366f1" stroke-width="2"/>
    
    <!-- Robe Torso -->
    <path d="M 70 120 L 130 120 L 140 180 Q 100 185 60 180 Z" fill="#0f172a" stroke="#3730a3" stroke-width="2"/>
    
    <!-- Chest Rune Core -->
    <polygon points="100,125 110,140 100,155 90,140" fill="#a855f7" stroke="#e9d5ff" stroke-width="1.5"/>

    <!-- Helm / Face Armor -->
    <path d="M 65 70 C 60 30, 40 20, 30 15 C 45 40, 60 70, 70 85 Z" fill="#4338ca" stroke="#818cf8" stroke-width="2"/>
    <path d="M 135 70 C 140 30, 160 20, 170 15 C 155 40, 140 70, 130 85 Z" fill="#4338ca" stroke="#818cf8" stroke-width="2"/>
    
    <!-- Main Hood / Skull Helm -->
    <path d="M 60 85 C 60 40, 140 40, 140 85 C 140 110, 125 125, 100 128 C 75 125, 60 110, 60 85 Z" fill="#1e1b4b" stroke="#6366f1" stroke-width="3"/>
    
    <!-- Void Face Mask -->
    <path d="M 72 80 Q 100 70 128 80 Q 115 115 100 120 Q 85 115 72 80 Z" fill="#030712"/>

    <!-- Glowing Eyes -->
    <ellipse cx="85" cy="88" rx="7" ry="4" transform="rotate(-15 85 88)" fill="#f43f5e" />
    <circle cx="85" cy="88" r="9" fill="url(#eyeGlow)" />
    
    <ellipse cx="115" cy="88" rx="7" ry="4" transform="rotate(15 115 88)" fill="#f43f5e" />
    <circle cx="115" cy="88" r="9" fill="url(#eyeGlow)" />

    <!-- Horns / Crown Spikes -->
    <polygon points="100,30 94,55 106,55" fill="#c084fc"/>
    <polygon points="80,38 76,60 88,57" fill="#818cf8"/>
    <polygon points="120,38 124,60 112,57" fill="#818cf8"/>
  </g>
</svg>
